name: Deploy Octocat to Azure

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: octocat-lab-deployment
  cancel-in-progress: false

env:
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  LOCATION: ${{ vars.AZURE_LOCATION }}
  ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            src/api-ts/package-lock.json
            src/frontend/package-lock.json
      - name: Build and run existing API tests
        working-directory: src/api-ts
        run: |
          npm ci
          npm run build
          npm exec vitest run
      - name: Build frontend
        working-directory: src/frontend
        run: |
          npm ci
          npm run build
      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Validate infrastructure
        run: |
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az group show --name "$RESOURCE_GROUP" --output none
      - name: Build and push images
        run: |
          az acr login --name "$ACR_NAME"
          SERVER=$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)
          docker build -t "$SERVER/api:$IMAGE_TAG" -f src/api-ts/Dockerfile src
          docker build -t "$SERVER/frontend:$IMAGE_TAG" src/frontend
          docker push "$SERVER/api:$IMAGE_TAG"
          docker push "$SERVER/frontend:$IMAGE_TAG"
          echo "LOGIN_SERVER=$SERVER" >> "$GITHUB_ENV"
      - name: Deploy infrastructure and apps
        run: |
          az deployment group create \
            --name octocat-lab \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters infra/main.parameters.json \
            --parameters location="$LOCATION" \
              apiImage="$LOGIN_SERVER/api:$IMAGE_TAG" \
              frontendImage="$LOGIN_SERVER/frontend:$IMAGE_TAG" \
            --output none
      - name: Verify public frontend and API
        run: |
          URL=$(az deployment group show --name octocat-lab --resource-group "$RESOURCE_GROUP" \
            --query properties.outputs.frontendUrl.value -o tsv)
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 10 "$URL/" > /dev/null
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 10 "$URL/api/products" > /dev/null
          echo "### Deployed application" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL/products" >> "$GITHUB_STEP_SUMMARY"
